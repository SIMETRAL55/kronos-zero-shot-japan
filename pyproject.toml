[project]
name = "kronos-explore"
version = "0.1.0"
description = "Pre-registered evaluation of Kronos on TOPIX500 ranking (H1) and Nikkei 225 volatility (H2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "pandas>=2.2,<3",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "arch>=7.0",
    "pyarrow>=16",
    "requests>=2.32",
    "einops==0.8.1",
    "huggingface_hub==0.33.1",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
